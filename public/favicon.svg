<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Pictogether">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9455a" />
      <stop offset="1" stop-color="#8a2333" />
    </linearGradient>
    <path id="corazon" d="M12 20.4S4 14.8 4 9.4A4.8 4.8 0 0 1 8.8 4.6c1.5 0 2.7.8 3.2 1.8.5-1 1.7-1.8 3.2-1.8A4.8 4.8 0 0 1 20 9.4c0 5.4-8 11-8 11Z" />
  </defs>

  <rect width="100" height="100" rx="22" fill="url(#fondo)" />

  <!-- Two polaroids leaning into each other. The left is drawn first so the
       right overlaps it; the right carries a background-coloured stroke, which
       cuts a gap between them so the pair reads as two cards rather than one
       white blob. -->
  <g transform="translate(36 44) rotate(-7)">
    <rect x="-18" y="-19" width="36" height="38" rx="4.5" fill="#fff" />
    <rect x="-13" y="-13.5" width="26" height="22" rx="2" fill="#eeb0b8" />
  </g>
  <g transform="translate(64 44) rotate(7)">
    <rect x="-18" y="-19" width="36" height="38" rx="4.5" fill="#fff" stroke="#a8324a" stroke-width="3" />
    <rect x="-13" y="-13.5" width="26" height="22" rx="2" fill="#d4707f" />
  </g>

  <!-- The halo follows the heart rather than being a disc, so the heart reads
       as one shape bridging both cards instead of a sticker pasted over them.
       It hangs slightly past the bottom edges on purpose: that is what joins
       the pair into a single object. -->
  <g transform="translate(50 58) scale(0.95) translate(-12 -12.5)">
    <use href="#corazon" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round" />
    <use href="#corazon" fill="#a32f42" />
  </g>
</svg>
